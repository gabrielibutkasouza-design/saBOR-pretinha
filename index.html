<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mundo das Araras</title>
    <style>
        body {
            background-color: #ffffff; /* Fundo branco */
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0056b3; /* Fundo azul destacado */
            color: white; /* Texto do título em branco */
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        main {
            padding: 20px;
        }

        .post {
            border: 1px solid #cccccc;
            margin: 20px auto;
            padding: 15px;
            max-width: 500px;
            border-radius: 8px;
        }

        h2 {
            color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mundo das Araras</h1>
        <p>Meu primeiro post</p>
    </header>

    <main>
        <section class="post">
            <h2>Sobre as Araras</h2>
            <p>As araras são aves coloridas e muito famosas na fauna brasileira. Elas vivem em florestas como a Amazônia e o Pantanal e se alimentam de sementes e frutas.</p>
        </section>
    </main>

    <footer>
        <p>Projeto de Tecnologia - 1º Ano</p>
    </footer>

</body>
</html>
